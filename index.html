<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bitable-editor</title>
</head>
<body>
  <div id="app">
    <div class="header">
      <h3>bitable-editor</h3>
      <div class="header-actions">
        <div class="menu-wrap">
          <button id="menuBtn" class="refresh-btn" title="更多功能">☰</button>
          <div id="menu" class="menu" hidden>
            <a id="helpLink" class="menu-item" target="_blank" rel="noopener noreferrer">使用教程</a>
          </div>
        </div>
        <button id="openPanelBtn" class="refresh-btn" title="在新标签页打开双栏面板（左边预览窗格自选字段展示，右边是侧边栏）">⧉</button>
        <button id="refreshBtn" class="refresh-btn" title="刷新视图记录列表">↻</button>
      </div>
      <div class="nav-controls">
        <button id="prevBtn" class="nav-btn" disabled>上一条</button>
        <input id="recordJump" class="jump-input" type="number" min="1" value="0" disabled />
        <span id="totalCount" class="index-display">/ 0</span>
        <button id="nextBtn" class="nav-btn" disabled>下一条</button>
      </div>
    </div>
    <div id="recordContent" class="content">
      <div class="loading">加载中...</div>
    </div>
    <div id="autoContent" class="content auto-content"></div>
    <div class="footer">
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="manual">人工编辑</button>
        <button class="mode-btn" data-mode="auto">自动刷写</button>
      </div>
      <div class="zoom-ctrl">
        <button id="zoomOutBtn" class="zoom-btn" title="缩小侧边栏字号">A−</button>
        <button id="zoomInBtn" class="zoom-btn" title="放大侧边栏字号">A＋</button>
      </div>
      <button id="undoBtn" class="undo-btn" disabled>撤销</button>
      <button id="saveBtn" class="save-btn" disabled>保存</button>
      <button id="filterBtn" class="filter-btn" disabled>筛选</button>
      <button id="runBtn" class="run-btn" disabled>刷写</button>
    </div>
  </div>
  <script type="module" src="/src/sidebar/index.ts"></script>
</body>
</html>
