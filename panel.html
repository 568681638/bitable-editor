<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bitable-editor · 双栏面板</title>
</head>
<body class="panel-page">
  <div class="panel-layout">
    <section class="viewer">
      <div id="connBanner" class="conn-banner" hidden>与侧边栏的连接已断开，请回到多维表格侧边栏确认插件仍在运行（或重新点击 ⧉）</div>
      <div id="layoutMsg" class="layout-msg"></div>
      <div id="blocks" class="blocks"></div>
      <div id="viewerLayer" class="viewer-layer"></div>
    </section>
    <div id="splitter" class="splitter" title="拖动调整预览窗格与侧边栏的宽度">
      <button id="collapseBtn" class="splitter-toggle" type="button" title="收起侧边栏">▶</button>
    </div>
    <div id="app">
      <div class="header">
        <h3 id="navHandle" draggable="true" title="拖到左边预览窗格，放一份标题行（含上一条 / 下一条、☰、⬚、↻）过去；侧边栏上的标题行保留，收起侧边栏后也能用">bitable-editor</h3>
        <div class="header-actions">
          <div class="menu-wrap">
            <button id="menuBtn" class="refresh-btn" title="更多功能">☰</button>
            <div id="menu" class="menu" hidden>
              <a id="helpLink" class="menu-item" target="_blank" rel="noopener noreferrer">使用教程</a>
              <button class="menu-item menu-group" data-submenu>双栏布局<span class="menu-arrow">▸</span></button>
              <div class="submenu" hidden>
                <button id="layoutImportBtn" class="menu-item sub" title="从文件导入预览窗格的布局（会替换当前表格的布局）">布局导入</button>
                <button id="layoutExportBtn" class="menu-item sub" title="把当前表格的预览窗格布局导出为文件，方便分享给别人">布局导出</button>
              </div>
            </div>
          </div>
          <button id="marqueeBtn" class="refresh-btn" title="框选：点一下后在左边预览窗格里按住拖出矩形，碰到的块会直接圈成组合块（框一个也行）；Esc 退出">⬚</button>
          <button id="refreshBtn" class="refresh-btn" title="刷新视图记录列表">↻</button>
        </div>
        <div class="nav-controls">
          <button id="prevBtn" class="nav-btn" disabled>上一条</button>
          <input id="recordJump" class="jump-input" type="number" min="1" value="0" disabled />
          <span id="totalCount" class="index-display">/ 0</span>
          <button id="nextBtn" class="nav-btn" disabled>下一条</button>
        </div>
      </div>
      <div id="recordContent" class="content">
        <div class="loading">加载中...</div>
      </div>
      <div id="autoContent" class="content auto-content"></div>
      <div class="footer">
        <div class="mode-switch">
          <button class="mode-btn active" data-mode="manual">人工编辑</button>
          <button class="mode-btn" data-mode="auto">批处理</button>
        </div>
        <div class="zoom-ctrl">
          <button id="zoomOutBtn" class="zoom-btn" title="缩小侧边栏字号">A−</button>
          <button id="zoomInBtn" class="zoom-btn" title="放大侧边栏字号">A＋</button>
        </div>
        <button id="undoBtn" class="undo-btn" disabled>撤销</button>
        <button id="saveBtn" class="save-btn" disabled>保存</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/panel/index.ts"></script>
</body>
</html>
