; ------------------------------------------------------------------
; supervisord program definition (模板)
; 详见同目录下 DEPLOY.md
; 想改端口 / 环境变量，直接编辑下方 environment= 行，然后跑 ./deploy.sh
; ------------------------------------------------------------------

[program:bitable-annotator]
command={{NODE}} {{PROJECT_DIR}}/server.mjs
directory={{PROJECT_DIR}}
environment=PORT="6868",NODE_ENV="production"
autostart=true
autorestart=true
startretries=10
startsecs=3
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/etc/dsw-logs/bitable-annotator.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
priority=100
